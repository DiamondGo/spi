name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:icons && npm run test:native-build
      - run: npm run check:privacy
      - run: npm run test:sessions && npm run test:launch && npm run test:settings && npm run test:yolo && npm run test:extension-ui && npm run test:terminal
      - run: npm run test:installer && npm run test:distribution
      - name: Redacted secret scan of Git history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner
