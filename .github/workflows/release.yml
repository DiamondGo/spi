name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_only:
        description: Recover publication from an already verified tag build
        type: boolean
        default: false
      release_tag:
        description: Existing release tag (recovery only)
        type: string
        default: ''
      source_run:
        description: Verified tag build run ID (recovery only)
        type: string
        default: ''
permissions:
  contents: read
env:
  SPI_RELEASE_REPOSITORY: ${{ github.repository }}
  SPI_NPM_PACKAGE: ${{ vars.SPI_NPM_PACKAGE }}
jobs:
  native:
    if: ${{ !inputs.publish_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            executable: dist/linux-unpacked/spi
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            executable: dist/linux-arm64-unpacked/spi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify native runner and release identity
        shell: bash
        run: |
          node -e "if(process.platform+'-'+process.arch!==process.argv[1])process.exit(1)" '${{ matrix.target }}'
          node -e "if(process.env.GITHUB_REF_TYPE==='tag'&&process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)process.exit(1)"
      - name: Install private GUI test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils
      - name: Allow the native test binary to create sandbox user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            sudo install -m 644 .github/spi-ci.apparmor /etc/apparmor.d/spi-native-ci
            sudo apparmor_parser -r /etc/apparmor.d/spi-native-ci
          fi
      - run: npm ci
      - run: node scripts/distribution.cjs prepare --production
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
      - run: npm run typecheck && npm run test:launch && npm run test:icons && npm run test:yolo && npm run test:extension-ui && npm run test:workspace-ui
      - name: Build complete native runtime (no AppImage)
        run: npm run dist -- --production
      - name: Native PTY, GUI, Pi RPC and single-instance smoke
        env:
          SPI_ASSERT_APP_ICON: '1'
          SPI_ASSERT_RENDERER_SANDBOX: '1'
        run: node scripts/with-display.cjs scripts/install-native-smoke.cjs
      - name: Full isolated Pi installation checks (Linux x64)
        if: matrix.target == 'linux-x64'
        run: npm run test:distribution
      - name: Inspect light npm contents
        run: npm pack ./dist/npm-package --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/release/spi-*.tar.gz
            dist/release/spi-*.zip
            dist/release/linux-*.json
            dist/release/win32-*.json
            dist/release/darwin-*.json
          if-no-files-found: error
  publish:
    needs: native
    if: always() && ((github.ref_type == 'tag' && needs.native.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_only))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      id-token: write
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify artifact provenance against the immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)process.exit(1)"
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          test "$source_sha" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Block publication on high/critical dependency advisories
        run: npm audit --audit-level=high
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          merge-multiple: true
          path: dist/release
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - run: node scripts/distribution.cjs prepare --production && node scripts/distribution.cjs manifest
      - name: Create draft, upload assets, then make Release visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --title "sPi $RELEASE_TAG (Linux)" --generate-notes
          fi
          shopt -s nullglob
          runtime_assets=(dist/release/spi-*.tar.gz)
          test "${#runtime_assets[@]}" -eq 2
          gh release upload "$RELEASE_TAG" --clobber "${runtime_assets[@]}" dist/release/release-manifest.json dist/release/SHA256SUMS dist/release/spi-installer.cjs dist/release/install.sh dist/release/INSTALLER-NOTICES.txt
          gh release edit "$RELEASE_TAG" --title "sPi $RELEASE_TAG (Linux)" --draft=false
      - name: Verify public assets before publishing npm
        run: node scripts/verify-release.cjs
      - name: Publish light npm package with Trusted Publishing
        if: vars.SPI_NPM_TRUSTED_PUBLISHING == 'true'
        working-directory: dist/npm-package
        run: |
          npm install --global npm@^11.5.1
          npm publish --provenance --access public
